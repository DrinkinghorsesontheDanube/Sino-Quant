[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
version = "0.2.0"
description = "A-share daily research and backtesting toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
data = ["akshare>=1.15,<2"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Standalone runners legitimately inject the project path before importing it.
"scripts/*.py" = ["E402"]

[tool.setuptools.packages.find]
where = ["src"]
